name: Build Docker Boxes

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  # build *.fusion.pkr.hcl for amd64 + arm64
  docker-aarch64:
    strategy:
      matrix:
        images:
        - alpine
        - distroless-debian
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # https://github.com/hashicorp/setup-packer
      - name: Setup packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PRODUCT_VERSION }}

      - name: Initialize Packer and validate HCLs
        working-directory: ${{ matrix.images }}
        run: |
          packer init .
          packer validate .

      - name: Build Boxes with Packer
        working-directory: ${{ matrix.images }}
        run: |
          export HCP_PROJECT_ID=${{ secrets.HCP_PROJECT_ID }}
          export HCP_CLIENT_ID=${{ secrets.PACKER_HCP_CLIENT_ID }}
          export HCP_CLIENT_SECRET=${{ secrets.PACKER_HCP_CLIENT_SECRET }}
          export VAGRANT_HCP_CLIENT_ID=${{ secrets.VAGRANT_HCP_CLIENT_ID }}
          export VAGRANT_HCP_CLIENT_SECRET=${{ secrets.VAGRANT_HCP_CLIENT_SECRET }}

          PACKER_LOG=1 packer build -only docker.${{ matrix.images }}_arm64 .

  # docker-x86_64:
