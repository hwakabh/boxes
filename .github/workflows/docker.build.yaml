name: Build Docker Boxes

on:
  # push:
  #   branches:
  #     - 'main'
  pull_request:
  workflow_dispatch:

jobs:
  # build *.fusion.pkr.hcl for amd64 + arm64
  docker-aarch64:
    strategy:
      matrix:
        images:
        - alpine
        - distroless-debian
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # https://github.com/hashicorp/setup-packer
      - name: Setup packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PRODUCT_VERSION }}

      - name: Initialize Packer and validate HCLs
        working-directory: ${{ matrix.images }}
        run: |
          packer init .
          packer validate .

      - name: Build Boxes with Packer
        working-directory: ${{ matrix.images }}
        run: |
          PACKER_LOG=1 packer build -only docker.docker_${{ matrix.images }}_arm64 .

