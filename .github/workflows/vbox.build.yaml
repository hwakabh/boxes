name: Build VirtualBox Boxes

on:
  # push:
  #   branches:
  #     - 'main'
  pull_request:
  workflow_dispatch:

env:
  PRODUCT_VERSION: "latest"

jobs:
  # build *.vbox.pkr.hcl for amd64 + arm64
  vbox-aarch64:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fusion
        run: brew install virtualbox

      - name: Setup packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PRODUCT_VERSION }}

      # For debug
      - name: Test buildings with packer
        run: |
          cd alpine/
          packer init .
          echo ""
          echo ""
          packer validate .
          echo ""
          echo ""
          PACKER_LOG=1 packer build -only virtualbox-iso.alpine_arm64 .


  vbox-x86_64:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
