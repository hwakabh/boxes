# branches:
#   only:
#     - main

branches:
  except: /^(main).*$/

language: generic

env:
  global:
    - secure: ""
    - secure: ""
    - secure: ""
    - secure: ""
    - secure: ""

jobs:
  include:
  - os: linux
    arch: amd64
    script:
    - wget -O- https://www.virtualbox.org/download/oracle_vbox_2016.asc | sudo gpg --dearmor --yes --output /usr/share/keyrings/oracle-virtualbox-2016.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/oracle-virtualbox-2016.gpg] http://download.virtualbox.org/virtualbox/debian $(lsb_release -cs) contrib" | sudo tee /etc/apt/sources.list.d/virtualbox.list
    - sudo apt-get update
    - sudo apt-get install -y VirtualBox-7.0
    - vboxmanage -v
    - wget -q https://download.virtualbox.org/virtualbox/7.0.26/Oracle_VM_VirtualBox_Extension_Pack-7.0.26-168464.vbox-extpack
    - echo 'y\n' | sudo vboxmanage extpack install Oracle_VM_VirtualBox_Extension_Pack-7.0.26-168464.vbox-extpack

  - os: linux
    arch: arm64
    script:
    - echo "TBA"

  # https://docs.travis-ci.com/user/reference/osx/#macos-version
  - os: macos
    osx_image: xcode14.2 # macOS 12.6
    arch: amd64
    script:
    - wget -q -O VMware-Fusion-13.6.2-24409261_universal.dmg "https://www.googleapis.com/drive/v3/files/1EUj2WznX-ifhPF2iJx9lmod-3mU5d6_7?alt=media&key=${GDRIVE_API_KEY}"
    - md5 VMware-Fusion-13.6.2-24409261_universal.dmg
    - hdiutil attach VMware-Fusion-13.6.2-24409261_universal.dmg
    - sudo cp -R /Volumes/VMware\ Fusion/VMware\ Fusion.app /Applications

  - os: macos
    osx_image: xcode14.2 # macOS 12.6
    arch: arm64
    script:
    - wget -q -O VMware-Fusion-13.6.2-24409261_universal.dmg "https://www.googleapis.com/drive/v3/files/1EUj2WznX-ifhPF2iJx9lmod-3mU5d6_7?alt=media&key=${GDRIVE_API_KEY}"
    - md5 VMware-Fusion-13.6.2-24409261_universal.dmg
    - hdiutil attach VMware-Fusion-13.6.2-24409261_universal.dmg
    - sudo cp -R /Volumes/VMware\ Fusion/VMware\ Fusion.app /Applications


install: true
